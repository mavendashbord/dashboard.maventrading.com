<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Maven Trading Group | Withdrawal Certificate</title>
    <style>
        /* ✅ Стили уже есть – сюда ДОБАВЬ стили карточки даты */
        body {
            margin: 0;
            background-color: #0f0f0f;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }
        .header {
            padding: 40px 20px;
            text-align: center;
        }
        .logo-text {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        .logo {
            height: 40px;
        }
        .brand {
            font-size: 22px;
            font-weight: 600;
        }
        .subtext {
            margin-top: 6px;
            font-size: 16px;
            opacity: 0.8;
            font-weight: 300;
        }
        .certificate-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        img {
            max-width: 95%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 10px;
        }

        /* 🔽 ВСТАВЬ ЭТО НИЖЕ (стиль карточки даты) */
        .date-card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
            margin: 20px auto;
            width: 300px;
            border-radius: 10px;
            text-align: left;
            font-size: 16px;
        }
        .date-label {
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .date-value {
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- 🔷 Логотип -->
    <div class="header">
      <div class="logo-text">
        <svg class="logo" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="30" width="20" height="50" rx="2" fill="white"/>
          <rect x="30" y="10" width="20" height="70" rx="2" fill="white"/>
          <rect x="60" y="20" width="20" height="60" rx="2" fill="white"/>
        </svg>
        <span class="brand">Maven Trading Group</span>
      </div>
      <div class="subtext">Withdrawal Certificate</div>
    </div>

    <!-- 🔽 Сертификат -->
    <div class="certificate-container">
        <img id="certificate" src="certificate.jpg" alt="Certificate">
    </div>

    <!-- ✅ ВСТАВЬ ЭТО СРАЗУ ПОД СЕРТИФИКАТОМ -->
    <div class="date-card">
        <div class="date-label">Date:</div>
        <div class="date-value" id="dateField">—</div>
    </div>

    <script>
        // ✅ Изменение картинки
        const urlParams = new URLSearchParams(window.location.search);
        const imageParam = urlParams.get('image');
        if (imageParam) {
            document.getElementById('certificate').src = imageParam;
        }

        // ✅ Добавление даты
        const dateParam = urlParams.get('date');
        if (dateParam) {
            document.getElementById('dateField').textContent = dateParam;
        }
    </script>
</body>
</html>
