<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maven Trading Group | Withdrawal Certificate</title>
<style>
    body {
        margin: 0;
        background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
        font-family: Arial, sans-serif;
        color: #e5e5e5;
        text-align: center;
    }

    /* Header */
    .header {
        padding: 50px 20px 20px;
    }

    .logo-text {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        opacity: 0;
        animation: fadeIn 1s forwards;
    }

    .logo {
        height: 50px;
        width: auto;
    }

    .brand {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .subtext {
        margin-top: 20px;
        font-size: 14px;
        opacity: 0.8;
        font-weight: 300;
        animation: fadeIn 1.2s forwards;
    }

    .certificate-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .certificate-container img {
        max-width: 65%;
        max-height: 55vh;
        border-radius: 14px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        display: block;
        margin: 0 auto;
        transition: all 0.3s ease;
        opacity: 0;
        animation: fadeIn 1.5s forwards;
    }

    @keyframes fadeIn {
        to { opacity: 1; }
    }

    /* Mobile responsiveness */
    @media (max-width: 600px) {
        .logo-text {
            flex-direction: column;
            gap: 8px;
        }
        .brand {
            font-size: 20px;
        }
        .subtext {
            font-size: 12px;
            margin-top: 15px;
        }
        .certificate-container img {
            max-width: 90%;
            max-height: 50vh;
        }
    }
</style>
</head>
<body>

<!-- Header with logo and text -->
<div class="header">
    <div class="logo-text">
        <!-- Здесь вставь свой логотип, сейчас онлайн-заглушка -->
        <img src="https://via.placeholder.com/150x50.png?text=Logo" class="logo" alt="Logo">
        <span class="brand">Maven Trading Group</span>
    </div>
    <div class="subtext">Withdrawal Certificate</div>
</div>

<!-- Certificate -->
<div class="certificate-container">
    <!-- Онлайн-заглушка сертификата -->
    <img id="certificate" src="https://via.placeholder.com/800x500.png?text=Certificate" alt="Certificate">
</div>

<script>
    // Позволяет менять изображение через URL параметр: ?image=ссылка_или_путь
    const urlParams = new URLSearchParams(window.location.search);
    const imageParam = urlParams.get('image');
    if (imageParam) {
        document.getElementById('certificate').src = imageParam;
    }
</script>

</body>
</html>
