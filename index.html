<title>Maven Trading Group | Withdrawal Certificate</title>

        font-family: Arial, sans-serif;
        color: #e5e5e5;
        text-align: center;
    }

    .header {
        padding: 50px 20px 20px;
    }

    .logo-text {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        opacity: 0;
        animation: fadeIn 1s forwards;
    }

    .logo {
        height: 50px;
        width: auto;
    }

    .brand {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .subtext {
        margin-top: 20px;
        font-size: 14px;
        opacity: 0.8;
        font-weight: 300;
        animation: fadeIn 1.2s forwards;
    }

    .certificate-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .certificate-container img {
        max-width: 65%;
        max-height: 55vh;
        border-radius: 14px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        display: block;
        margin: 0 auto;
        transition: all 0.3s ease;
        opacity: 0;
        animation: fadeIn 1.5s forwards;
    }

    @keyframes fadeIn {
        to { opacity: 1; }
    }

    @media (max-width: 600px) {
        .logo-text {
            flex-direction: column;
            gap: 8px;
        }
        .brand {
            font-size: 20px;
        }
        .subtext {
            font-size: 12px;
            margin-top: 15px;
        }
        .certificate-container img {
            max-width: 90%;
            max-height: 50vh;
        }
    }
</style>
